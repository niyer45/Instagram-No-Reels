<!doctype html>
<!-- Variant of home-feed.html for the refresh hide: adds Instagram's fixed Following bar (with its padding spacer), an in-document
     stories row, and a 4 s delay before the posts appear when the document is a reload (so a pull-to-refresh stays held long
     enough to screenshot). Simulator fixture for the Home harness (Sources/Pages/HomeDemo.swift, DEBUG only).
     An approximation of Instagram's m-web Following feed markup, built only from the
     assumptions in docs/DOM-NOTES.md, so NativeSkin.css, Bridge.js and FeedFilter.js can be
     exercised and screenshotted without signing in. The inline <style> stands in for
     Instagram's own stylesheet (base font, link and button resets). Not bundled in the app. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Instagram</title>
<style>
  body { margin: 0; background: rgb(12, 16, 20); color: rgb(245, 245, 245);
         font: 400 14px/18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  @media (prefers-color-scheme: light) { body { background: rgb(255, 255, 255); color: rgb(0, 0, 0); } }
  a { color: inherit; text-decoration: none; }
  button { background: none; border: 0; padding: 0; color: inherit; font: inherit; }
  article { border: 1px solid rgba(128, 128, 128, 0.3); border-radius: 8px; margin: 0 8px 12px; }
  header { display: flex; align-items: center; gap: 8px; padding: 8px 12px; }
  header img { width: 42px; height: 42px; border-radius: 50%; }
  .media { width: 100%; aspect-ratio: 1 / 1; display: block; }
  .actions { display: flex; align-items: center; padding: 4px 4px; }
  .actions [role="button"] { padding: 8px; display: flex; }
  .actions .spacer { flex: 1; }
  svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2; }
  .body { padding: 0 12px 12px; }
  .body > * { display: block; margin-top: 6px; }
  .dots { display: flex; gap: 4px; padding: 6px; }
  .dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(128, 128, 128, 0.6); }
  .older { display: block; padding: 16px; text-align: center; }
  .fbar { position: fixed; top: 0; left: 0; right: 0; height: 44px; z-index: 5; display: flex; align-items: center; justify-content: center; gap: 6px; background: rgb(12, 16, 20); }
  @media (prefers-color-scheme: light) { .fbar { background: rgb(255, 255, 255); } }
  .fbar svg { width: 12px; height: 12px; }
  .fpad { padding-top: 44px; }
  .srow { display: flex; gap: 14px; height: 100px; width: 100%; padding: 8px 12px; box-sizing: border-box; overflow: hidden; }
  .srow a { flex: none; width: 72px; height: 72px; border-radius: 50%; background: linear-gradient(135deg, #f58529, #dd2a7b, #8134af); }
  html.reloading .feed { display: none; }
</style>
<script>
  // A reload (pull-to-refresh) shows the posts only after 4 s.
  (function () {
    const nav = performance.getEntriesByType('navigation')[0];
    if (!window.__fixtureReload && (!nav || nav.type !== 'reload')) return; // the Home demo flags its re-load of the fixture
    // The feed is taken out of the document as soon as it is parsed and put back after 4 s.
    let feed = null, parent = null;
    new MutationObserver(() => {
      const el = document.querySelector('.feed');
      if (!el || feed) return;
      feed = el; parent = el.parentNode; el.remove();
      setTimeout(() => parent.appendChild(feed), 4000);
    }).observe(document, { childList: true, subtree: true });
  })();
</script>
<script>
  // Membership and dates as Instagram's own JSON would carry them (FeedFilter reads
  // script[type="application/json"]): two recent posts by followed accounts, one older post.
  (function () {
    const now = Math.floor(Date.now() / 1000);
    const item = (code, username, age) => ({ code, taken_at: now - age, media_type: 1, product_type: 'feed', is_ad: false, is_suggested: false,
      user: { username, friendship_status: { following: true } } });
    const data = { items: [item('AAAAAAAAAA1', 'alice', 3600 * 2), item('BBBBBBBBBB2', 'bob.travels', 3600 * 9), item('CCCCCCCCCC3', 'carol', 86400 * 4)] };
    const script = document.createElement('script');
    script.type = 'application/json';
    script.textContent = JSON.stringify(data);
    document.head.appendChild(script);
  })();
</script>
</head>
